AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Neemu - the tree that calls you when it's thirsty. API, water balance, voice.

Parameters:
  RequireAuth:
    Type: String
    Default: "off"
    AllowedValues: ["on", "off"]
    Description: on = every write needs a Cognito sign-in. off = requests without a token are believed.
  AppUrl:
    Type: String
    Default: https://main.d1wy94gbpeilv8.amplifyapp.com
    Description: Where the web app is hosted; Cognito sends people back here after sign-in.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: src/
    Timeout: 28
    MemorySize: 1024
    Environment:
      Variables:
        TABLE: !Ref Table
        MEDIA_BUCKET: !Ref MediaBucket
        REQUIRE_AUTH: !Ref RequireAuth

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # Proof photos and Neemu's spoken lines. Private; the API hands out short-lived links.
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - { Id: expire-proofs, Prefix: proofs/, Status: Enabled, ExpirationInDays: 30 }
          - { Id: expire-audio, Prefix: audio/, Status: Enabled, ExpirationInDays: 30 }

  # ---- sign-in: Cognito user pool with its hosted sign-in page ----
  Users:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: neemu-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      Policies:
        PasswordPolicy: { MinimumLength: 8, RequireLowercase: true, RequireNumbers: true, RequireSymbols: false, RequireUppercase: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]

  UsersDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref Users
      Domain: neemu-saplings

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Users
      ClientName: neemu-web
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, aws.cognito.signin.user.admin]
      CallbackURLs: [!Sub "${AppUrl}/", "http://localhost:5173/"]
      LogoutURLs: [!Sub "${AppUrl}/", "http://localhost:5173/"]
      AccessTokenValidity: 12
      IdTokenValidity: 12
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  Organisers:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref Users
      GroupName: organisers
      Description: People who run a plantation drive.

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*amazon.nova-*
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neemu/vapid-*
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neemu/agent-*
      Events:
        GetTree: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET, Path: "/trees/{id}" } }
        Adopt: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/trees/{id}/adopt" } }
        Today: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET, Path: "/trees/{id}/today" } }
        Talk: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/trees/{id}/talk" } }
        ProofUrl: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/trees/{id}/proof-url" } }
        Proof: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/trees/{id}/proof" } }
        Buddies: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET, Path: "/trees/{id}/buddies" } }
        Cover: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/trees/{id}/cover" } }
        CoverAccept: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/covers/{id}/accept" } }
        CoverDecline: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/covers/{id}/decline" } }
        Subscribe: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/trees/{id}/subscribe" } }
        PushKey: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET, Path: "/push/key" } }
        GetDrive: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET, Path: "/drives/{id}" } }
        Remind: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/drives/{id}/remind" } }
        Nearby: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET, Path: "/drives/{id}/nearby" } }
        PhotoUrl: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/drives/{id}/photo-url" } }
        Register: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/drives/{id}/trees" } }
        DriveReviews: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET, Path: "/drives/{id}/reviews" } }
        MyReviews: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: GET, Path: "/reviews" } }
        Review: { Type: HttpApi, Properties: { ApiId: !Ref Api, Method: POST, Path: "/proofs/{id}/review" } }

  # ---- the morning check: EventBridge -> Step Functions -> one Lambda run per sapling ----
  ListTreesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: daily.list_trees
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }

  CheckTreeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: daily.check_tree
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*amazon.nova-*
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neemu/vapid-*
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neemu/agent-*

  SummariseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: daily.summarise
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }

  MorningCheck:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Definition:
        Comment: Every morning, each sapling works out from real weather whether it needs water today.
        StartAt: ListSaplings
        States:
          ListSaplings:
            Type: Task
            Resource: !GetAtt ListTreesFunction.Arn
            Next: CheckEachSapling
          CheckEachSapling:
            Type: Map
            ItemsPath: $.trees
            MaxConcurrency: 5
            ResultPath: $.results
            ItemProcessor:
              StartAt: MorningCheckForOne
              States:
                MorningCheckForOne:
                  Type: Task
                  Resource: !GetAtt CheckTreeFunction.Arn
                  Retry:
                    - ErrorEquals: [States.TaskFailed]
                      IntervalSeconds: 5
                      MaxAttempts: 2
                      BackoffRate: 2
                  Catch:
                    - ErrorEquals: [States.ALL]
                      ResultPath: $.error
                      Next: SaplingFailed
                  End: true
                SaplingFailed:
                  Type: Pass
                  End: true
            Next: Summarise
          Summarise:
            Type: Task
            Resource: !GetAtt SummariseFunction.Arn
            End: true
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref ListTreesFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref CheckTreeFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref SummariseFunction }
      Events:
        SixEveryMorningIST:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 6 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata

  # Loads the example drive. Run once after the first deploy.
  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: seed.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }

Outputs:
  ApiUrl: { Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com" }
  Table: { Value: !Ref Table }
  MediaBucket: { Value: !Ref MediaBucket }
  SeedFunction: { Value: !Ref SeedFunction }
  UserPoolId: { Value: !Ref Users }
  WebClientId: { Value: !Ref WebClient }
  SignInDomain: { Value: !Sub "neemu-saplings.auth.${AWS::Region}.amazoncognito.com" }
  MorningCheck: { Value: !Ref MorningCheck }
